# Fork-only. Upstream's deps-db-sync.yml runs the same jobs but only on `master`,
# so this re-triggers them on the patch branch. Kept as a separate file so
# upstream rebases never conflict with it.
name: fork/db-sync CI

on:
  push:
    branches: [whitelist]
    paths:
      - 'deps/db-sync/**'
      - 'deps/common/**'
      - 'deps/db/**'
      - '.github/workflows/fork-db-sync-ci.yml'
      - '!deps/db-sync/**.md'
  pull_request:
    branches: [whitelist]
  workflow_dispatch:

defaults:
  run:
    working-directory: deps/db-sync

env:
  CLOJURE_VERSION: '1.12.4.1618'
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  BABASHKA_VERSION: '1.12.215'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: deps/db-sync/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Fetch pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:node-adapter

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Run clj-kondo lint
        run: clojure -M:clj-kondo --lint src test

      - name: Carve lint for unused vars
        run: bb lint:carve

      - name: Lint for vars that are too large
        run: bb lint:large-vars
